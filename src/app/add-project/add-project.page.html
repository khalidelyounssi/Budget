<ion-content [fullscreen]="true">
  <section class="app-screen page-content">
    <div class="top-row">
      <button class="round-action" routerLink="/home" type="button" aria-label="Retour">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <div>
        <span>Nouveau projet</span>
        <strong>Paramètres du budget</strong>
      </div>
      <div class="avatar brand-mark" aria-hidden="true"></div>
    </div>

    <div class="form-intro">
      <p class="eyebrow">Création</p>
      <h1>Créer un projet</h1>
      <p>Renseignez les informations principales du projet et le budget prévu.</p>
    </div>

    <ion-card class="form-card">
      <ion-card-content>
        <form [formGroup]="projectForm" (ngSubmit)="addProject()">
          <div class="field-group">
            <label class="field-label" for="project-name">Nom du projet *</label>
            <ion-item class="input-item">
              <ion-input id="project-name" formControlName="name" placeholder="Ex: Rénovation du salon"></ion-input>
            </ion-item>
          </div>
          <ion-text color="danger" *ngIf="projectForm.controls.name.touched && projectForm.controls.name.invalid">
            <small>Le nom du projet est obligatoire.</small>
          </ion-text>

          <div class="field-group">
            <label class="field-label" for="project-description">Description</label>
            <ion-item class="input-item textarea-item">
              <ion-textarea
                id="project-description"
                formControlName="description"
                placeholder="Ex: Peinture, portes, matériel et main d'oeuvre"
                rows="4"
              ></ion-textarea>
            </ion-item>
          </div>

          <div class="field-group">
            <label class="field-label" for="project-budget">Budget estimé en DH *</label>
            <ion-item class="input-item">
              <ion-input id="project-budget" formControlName="estimatedBudget" min="0.01" placeholder="Ex: 3000" type="number"></ion-input>
            </ion-item>
          </div>
          <ion-text
            color="danger"
            *ngIf="projectForm.controls.estimatedBudget.touched && projectForm.controls.estimatedBudget.invalid"
          >
            <small>Le budget est obligatoire et doit être un nombre positif.</small>
          </ion-text>

          <ion-button expand="block" type="submit" class="submit-button" [disabled]="isSavingProject">
            <ion-icon name="save-outline" slot="start"></ion-icon>
            {{ isSavingProject ? 'Enregistrement...' : 'Enregistrer le projet' }}
          </ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </section>
</ion-content>
