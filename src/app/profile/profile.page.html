<ion-content [fullscreen]="true">
  <section class="app-screen page-content">
    <div class="profile-hero">
      <div class="big-avatar brand-mark" aria-hidden="true"></div>
      <h1>{{ projectService.getProfile().name }}</h1>
      <p>Données stockées localement sur cet appareil.</p>
    </div>

    <ion-card class="profile-card">
      <ion-card-content>
        <h2>Informations du profil</h2>
        <div class="field-group">
          <label class="field-label" for="profile-name">Nom</label>
          <ion-item class="input-item">
            <ion-input id="profile-name" [(ngModel)]="profileName" placeholder="Ex: Budget Manager"></ion-input>
          </ion-item>
        </div>
        <ion-button expand="block" (click)="saveProfile()">
          <ion-icon name="save-outline" slot="start"></ion-icon>
          Sauvegarder
        </ion-button>
      </ion-card-content>
    </ion-card>

    <div class="stats-grid">
      <ion-card>
        <ion-card-content>
          <span>Projets</span>
          <strong>{{ projectsCount }}</strong>
        </ion-card-content>
      </ion-card>
      <ion-card>
        <ion-card-content>
          <span>Notes</span>
          <strong>{{ notesCount }}</strong>
        </ion-card-content>
      </ion-card>
    </div>

    <ion-card class="profile-card">
      <ion-card-content>
        <h2>Sauvegarde des données</h2>
        <p>Exportez ou restaurez les projets, dépenses, notes et informations du profil.</p>
        <div class="backup-actions">
          <ion-button expand="block" (click)="exportBackup()">
            <ion-icon name="cloud-download-outline" slot="start"></ion-icon>
            Export JSON
          </ion-button>
          <label class="import-button">
            <input type="file" accept="application/json" (change)="restoreBackup($event)" />
            <ion-icon name="cloud-upload-outline"></ion-icon>
            Import JSON
          </label>
        </div>
      </ion-card-content>
    </ion-card>

    <nav class="bottom-nav" aria-label="Navigation principale">
      <button class="nav-item" routerLink="/home" type="button">
        <ion-icon name="home-outline"></ion-icon>
        <span>Accueil</span>
      </button>
      <button class="nav-item" routerLink="/stats" type="button">
        <ion-icon name="analytics-outline"></ion-icon>
        <span>Suivi</span>
      </button>
      <button class="add-nav" routerLink="/add-project" type="button" aria-label="Ajouter un projet">
        <ion-icon name="add-outline"></ion-icon>
      </button>
      <button class="nav-item" routerLink="/notes" type="button">
        <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
        <span>Notes</span>
      </button>
      <button class="nav-item active" type="button">
        <ion-icon name="person-circle-outline"></ion-icon>
        <span>Profil</span>
      </button>
    </nav>
  </section>
</ion-content>
